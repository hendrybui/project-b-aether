<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DJ Toolkit{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom border-secondary bg-black sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="{{ url_for('index') }}">
        <span class="brand-dot"></span> DJ Toolkit
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('stems_page') }}">Stems &amp; BPM/Key</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('midi_page') }}">MP3 → MIDI</a></li>
        </ul>
        <span id="health-badge" class="badge ms-lg-3 badge-unknown">checking…</span>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-4 py-lg-5">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-secondary small py-4 border-top border-secondary mt-5">
    DJ Toolkit · thin client over <code>AudioMass</code> (htdemucs_6s + librosa) · MP3→MIDI via basic-pitch
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
