<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio → Sheet Music — Music Tools</title>
  <style>
    :root {
      --bg: #0f1117; --panel: #1a1d27; --panel2: #232734; --border: #2d3142;
      --text: #e4e6eb; --muted: #8b90a0; --accent: #e94560; --accent2: #0f3460;
      --green: #4ade80;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--text);
      min-height: 100vh; padding: 24px; line-height: 1.5;
    }
    .wrap { max-width: 1100px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 28px; }
    header h1 { font-size: 28px; font-weight: 600; }
    header h1 span { color: var(--accent); }
    header p { color: var(--muted); font-size: 14px; margin-top: 6px; }

    .upload {
      background: var(--panel); border: 2px dashed var(--border); border-radius: 12px;
      padding: 40px 20px; margin-bottom: 24px; text-align: center; cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .upload:hover, .upload.dragover { border-color: var(--accent); background: var(--panel2); }
    .upload input { display: none; }
    .upload-icon { font-size: 42px; margin-bottom: 12px; }
    .upload-text { font-size: 16px; }
    .upload-hint { font-size: 13px; color: var(--muted); margin-top: 6px; }

    .controls {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 20px; margin-bottom: 20px;
      display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
    }
    .controls label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .controls select, .controls input[type="number"] {
      background: var(--panel2); border: 1px solid var(--border); color: var(--text);
      padding: 6px 10px; border-radius: 6px; font-size: 14px;
    }
    .controls .field { display: flex; flex-direction: column; gap: 4px; }
    .controls button {
      background: var(--accent); color: white; border: none; padding: 8px 18px;
      border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
    .controls button.secondary { background: var(--panel2); border: 1px solid var(--border); }

    .status {
      text-align: center; padding: 20px; color: var(--muted); font-size: 14px;
    }
    .status.error { color: var(--accent); }
    .progress-bar {
      width: 100%; max-width: 400px; height: 8px; background: var(--panel2);
      border-radius: 4px; overflow: hidden; margin: 12px auto; display: none;
    }
    .progress-bar.show { display: block; }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
      width: 0%; transition: width 0.3s;
    }

    .sheet-area {
      background: white; border-radius: 12px; padding: 24px; overflow-x: auto;
      min-height: 200px;
    }
    .sheet-area.empty { display: flex; align-items: center; justify-content: center; color: #999; }
    .sheet-area svg { display: block; margin: 0 auto 16px; }
    .note-list { margin-top: 20px; }
    .note-list h3 { font-size: 14px; color: var(--text); margin-bottom: 10px; }
    .note-list table { width: 100%; border-collapse: collapse; font-size: 13px; color: var(--text); }
    .note-list th, .note-list td { padding: 4px 8px; text-align: left; border-bottom: 1px solid var(--border); }
    .note-list th { color: var(--muted); font-weight: 500; }
    .stats { display: flex; gap: 24px; margin-bottom: 16px; font-size: 13px; color: var(--muted); }
    .stats b { color: var(--text); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Audio → <span>Sheet Music</span></h1>
      <p>Upload an audio file — basic-pitch transcribes the notes, VexFlow renders them on a staff.</p>
    </header>

    <label class="upload" id="dropzone">
      <div class="upload-icon">🎵</div>
      <div class="upload-text" id="dz-text">Click or drop an audio file here</div>
      <div class="upload-hint">MP3, WAV, FLAC, M4A, OGG</div>
      <input type="file" id="fileinput" accept=".mp3,.wav,.flac,.m4a,.aac,.ogg,audio/*">
    </label>

    <div class="progress-bar" id="progbar"><div class="progress-fill" id="progfill"></div></div>
    <div class="status" id="status"></div>

    <div class="controls" id="controls" style="display:none;">
      <div class="field">
        <label>Max notes</label>
        <input type="number" id="maxnotes" value="32" min="4" max="128" step="4">
      </div>
      <div class="field">
        <label>Start at</label>
        <input type="number" id="startsec" value="0" min="0" step="0.5"> <span style="color:var(--muted)">sec</span>
      </div>
      <div class="field">
        <label>Clef</label>
        <select id="clef"><option value="treble">Treble</option><option value="bass">Bass</option></select>
      </div>
      <button id="replay">▶ Play selection</button>
      <button id="exportmidi" class="secondary">⬇ Export MIDI</button>
      <button id="rerender" class="secondary">↻ Re-render</button>
    </div>

    <div class="sheet-area empty" id="sheet">Notes will appear here after upload</div>

    <div class="note-list" id="notelist" style="display:none;">
      <div class="stats" id="stats"></div>
      <h3>Detected notes</h3>
      <table><thead><tr><th>#</th><th>Time</th><th>Pitch</th><th>MIDI</th><th>Dur (s)</th><th>Vel</th></tr></thead>
        <tbody id="notetbody"></tbody></table>
    </div>
  </div>

  <script src="vendor/vexflow.js"></script>
  <script src="vendor/tone.js"></script>
  <script>
  (function () {
    'use strict';
    var Vex = window.VexFlow; // VexFlow 5 global
    var allNotes = [];        // notes from the server
    var elDrop = document.getElementById('dropzone');
    var elInput = document.getElementById('fileinput');
    var elDzText = document.getElementById('dz-text');
    var elStatus = document.getElementById('status');
    var elProgBar = document.getElementById('progbar');
    var elProgFill = document.getElementById('progfill');
    var elSheet = document.getElementById('sheet');
    var elControls = document.getElementById('controls');
    var elNoteList = document.getElementById('notelist');
    var elTbody = document.getElementById('notetbody');
    var elStats = document.getElementById('stats');

    // API base: audiomass server on 5055 (same host).
    var API = window.location.protocol + '//' + window.location.hostname + ':5055';

    // ---- file handling ----
    elDrop.addEventListener('click', function () { elInput.click(); });
    elDrop.addEventListener('dragover', function (e) { e.preventDefault(); elDrop.classList.add('dragover'); });
    elDrop.addEventListener('dragleave', function () { elDrop.classList.remove('dragover'); });
    elDrop.addEventListener('drop', function (e) {
      e.preventDefault();
      elDrop.classList.remove('dragover');
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    elInput.addEventListener('change', function () {
      if (elInput.files[0]) handleFile(elInput.files[0]);
    });

    function setStatus(msg, isError) {
      elStatus.textContent = msg || '';
      elStatus.className = 'status' + (isError ? ' error' : '');
    }

    function handleFile(file) {
      elDzText.textContent = file.name;
      setStatus('Uploading & transcribing... (this can take 10–60s depending on length)');
      elProgBar.classList.add('show');
      elProgFill.style.width = '20%';

      var fd = new FormData();
      fd.append('file', file, file.name);

      // fake progress while the server works
      var prog = 20;
      var iv = setInterval(function () {
        if (prog < 90) { prog += 5; elProgFill.style.width = prog + '%'; }
      }, 800);

      fetch(API + '/api/transcribe', { method: 'POST', body: fd })
        .then(function (r) {
          if (!r.ok) return r.json().then(function (e) { throw new Error(e.detail || ('HTTP ' + r.status)); });
          return r.json();
        })
        .then(function (data) {
          clearInterval(iv);
          elProgFill.style.width = '100%';
          if (!data.notes || !data.notes.length) {
            setStatus('No notes detected in this audio. Try a clearer / more melodic source.', true);
            elProgBar.classList.remove('show');
            return;
          }
          allNotes = data.notes;
          setStatus('Detected ' + data.count + ' notes. Rendering sheet music...');
          elControls.style.display = 'flex';
          renderAndList();
          setStatus('');
          elProgBar.classList.remove('show');
          elProgFill.style.width = '0%';
        })
        .catch(function (err) {
          clearInterval(iv);
          elProgBar.classList.remove('show');
          setStatus('Transcription failed: ' + err.message, true);
        });
    }

    // ---- selection (which notes to render) ----
    function selectedNotes() {
      var max = parseInt(document.getElementById('maxnotes').value, 10);
      var start = parseFloat(document.getElementById('startsec').value) || 0;
      return allNotes
        .filter(function (n) { return n.start >= start; })
        .sort(function (a, b) { return a.start - b.start; })
        .slice(0, max);
    }

    // ---- VexFlow rendering ----
    function midiToVexPitch(midi) {
      var NAMES = ['c', 'c#', 'd', 'd#', 'e', 'f', 'f#', 'g', 'g#', 'a', 'a#', 'b'];
      var name = NAMES[((midi % 12) + 12) % 12];
      var octave = Math.floor(midi / 12) - 1; // MIDI 60 = C4
      return name + '/' + octave;
    }

    function beatsForDuration(dur) {
      // Map seconds → a duration token. Rough: assume ~120bpm (0.5s/beat).
      if (dur < 0.25) return '8';
      if (dur < 0.6) return 'q';
      if (dur < 1.2) return 'h';
      return 'w';
    }

    function renderAndList() {
      var notes = selectedNotes();
      renderStaff(notes);
      listNotes(notes);
    }

    function renderStaff(notes) {
      elSheet.className = 'sheet-area';
      elSheet.innerHTML = '';
      if (!notes.length) {
        elSheet.className = 'sheet-area empty';
        elSheet.textContent = 'No notes in selection.';
        return;
      }
      if (!Vex) {
        elSheet.className = 'sheet-area empty';
        elSheet.textContent = 'VexFlow not loaded.';
        return;
      }

      var clef = document.getElementById('clef').value;
      // Group notes into measures of 4 beats for readability.
      var BEATS_PER = 4;
      var measures = [];
      var cur = [];
      var curBeats = 0;
      notes.forEach(function (n) {
        var beats = n.duration < 0.25 ? 0.5 : (n.duration < 0.6 ? 1 : (n.duration < 1.2 ? 2 : 4));
        if (curBeats + beats > BEATS_PER && cur.length) {
          measures.push(cur); cur = []; curBeats = 0;
        }
        cur.push({ midi: n.midi, beats: beats });
        curBeats += beats;
      });
      if (cur.length) measures.push(cur);

      // Render up to ~8 measures (too many = unreadable + slow).
      measures = measures.slice(0, 8);

      measures.forEach(function (m, mi) {
        var container = document.createElement('div');
        container.id = 'measure-' + mi;
        elSheet.appendChild(container);

        try {
          var renderer = new Vex.Flow.Renderer(container, Vex.Flow.Renderer.Backends.SVG);
          var width = 200 + m.length * 30;
          renderer.resize(width, 140);
          var context = renderer.getContext();
          var stave = new Vex.Flow.Stave(10, 20, width - 20);
          if (mi === 0) stave.addClef(clef).addTimeSignature('4/4');
          stave.setContext(context).draw();

          var scoreTokens = m.map(function (note) {
            return midiToVexPitch(note.midi) + '/' + beatsForDurationFromBeats(note.beats);
          }).join(', ');

          var voice = new Vex.Flow.Voice({ numBeats: BEATS_PER, beatValue: 4 });
          var vfNotes = new Vex.Flow.EasyScore().notes(scoreTokens, { clef: clef });
          voice.setStrict(false);
          voice.addTickables(vfNotes);
          new Vex.Flow.Formatter().joinVoices([voice]).format([voice], width - 40);
          voice.draw(context, stave);
        } catch (err) {
          container.textContent = '(measure ' + (mi + 1) + ': ' + (err.message || err) + ')';
        }
      });
    }

    function beatsForDurationFromBeats(beats) {
      if (beats <= 0.5) return '8';
      if (beats <= 1) return 'q';
      if (beats <= 2) return 'h';
      return 'w';
    }

    function listNotes(notes) {
      elNoteList.style.display = 'block';
      var midis = notes.map(function (n) { return n.midi; });
      elStats.innerHTML =
        '<span>Notes: <b>' + notes.length + '</b></span>' +
        '<span>Range: <b>' + Math.min.apply(null, midis) + '–' + Math.max.apply(null, midis) + '</b> (MIDI)</span>' +
        '<span>Duration: <b>' + (notes[notes.length - 1].start + notes[notes.length - 1].duration).toFixed(1) + 's</b></span>';
      elTbody.innerHTML = notes.map(function (n, i) {
        return '<tr><td>' + (i + 1) + '</td><td>' + n.start.toFixed(2) + 's</td>' +
          '<td>' + n.pitch + '</td><td>' + n.midi + '</td>' +
          '<td>' + n.duration.toFixed(2) + '</td><td>' + n.amplitude.toFixed(2) + '</td></tr>';
      }).join('');
    }

    // ---- playback ----
    var synth = null;
    function ensureSynth() {
      if (!synth) {
        synth = new Tone.Synth({
          oscillator: { type: 'triangle' },
          envelope: { attack: 0.01, decay: 0.2, sustain: 0.3, release: 0.5 }
        }).toDestination();
        synth.volume.value = -6;
      }
      return synth;
    }
    function playSelection() {
      var notes = selectedNotes();
      if (!notes.length) return;
      Tone.start();
      ensureSynth();
      Tone.Transport.cancel(0);
      var part = new Tone.Part(function (time, n) {
        synth.triggerAttackRelease(n.pitch.replace('#', '#'), Math.max(n.duration * 0.9, 0.1), time);
      }, notes.map(function (n) { return [n.start, n]; }));
      part.start(0);
      Tone.Transport.start();
    }

    // ---- export MIDI (reuse MelodyTool if available, else minimal encoder) ----
    function exportMidi() {
      var notes = selectedNotes();
      if (!notes.length) return;
      var MT = window.MelodyTool;
      if (MT) {
        // adapt to MelodyTool's {midi, beats} format; assume 120bpm (0.5s/beat)
        var mel = notes.map(function (n) { return { midi: n.midi, beats: n.duration * 2 }; });
        var bytes = MT.melodyToMidi(mel, 120);
        MT.downloadMidi('transcription.mid', bytes);
      }
    }

    document.getElementById('replay').addEventListener('click', playSelection);
    document.getElementById('exportmidi').addEventListener('click', exportMidi);
    document.getElementById('rerender').addEventListener('click', renderAndList);
    document.getElementById('clef').addEventListener('change', renderAndList);
  })();
  </script>
  <script src="app/melody.js"></script>
  </body>
</html>
